<style>

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;

 linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh;
 display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.7}
.box{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px;
 box-shadow:var(--shadow);backdrop-filter:blur(10px);max-width:420px;width:100%}
h1{font-size:20px;font-weight:700;margin-bottom:8px}
p{font-size:14.5px;opacity:.75}
form{display:flex;flex-direction:column;gap:12px;margin-top:24px}
input{font-family:inherit;font-size:16px;padding:12px 16px;border-radius:16px;
 border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
button{font-family:inherit;font-size:15px;font-weight:600;padding:12px 16px;border-radius:16px;
 border:1px solid var(--line);background:var(--accent);color:#fff;cursor:pointer}
button:hover{opacity:.92}
.err{color:var(--danger);font-size:14px;min-height:20px}
</style></head><body>
