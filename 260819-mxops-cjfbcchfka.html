<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>문서 열람</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{--bg:#fbfaf7;--bg2:#f2efe9;--surface:#fff;--ink:#221f1a;--line:rgba(60,50,35,.14);
--accent:#7d5a2b;--accent-soft:rgba(125,90,43,.07);--danger:#a4392f;
--shadow:0 20px 44px -26px rgba(60,45,20,.24),0 1px 3px rgba(60,45,20,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171512;--bg2:#201d18;--surface:#211e19;--ink:#f0ece3;--line:rgba(230,210,175,.16);--accent:#d6b184;--accent-soft:rgba(214,177,132,.1);--danger:#e5897d;--shadow:0 20px 44px -26px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#171512;--bg2:#201d18;--surface:#211e19;--ink:#f0ece3;--line:rgba(230,210,175,.16);--accent:#d6b184;--accent-soft:rgba(214,177,132,.1);--danger:#e5897d;--shadow:0 20px 44px -26px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.35)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh;
display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.75}
.box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:32px;
box-shadow:var(--shadow);max-width:420px;width:100%;display:flex;flex-direction:column;gap:8px}
h1{font-size:20px;font-weight:700}
p{font-size:14.5px;opacity:.75}
form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
input{font-family:inherit;font-size:16px;padding:12px 16px;border-radius:14px;
border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.go{font-family:inherit;font-size:15px;font-weight:600;padding:12px 16px;border-radius:14px;
border:1px solid transparent;background:var(--accent);color:#fff;cursor:pointer}
.go:hover{filter:brightness(1.06)}
.go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--danger);font-size:14px;min-height:20px}
#mxTheme{position:fixed;top:16px;right:16px;display:flex;gap:6px;font-size:13px;font-weight:600;
font-family:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);
border-radius:999px;padding:8px 14px;cursor:pointer;opacity:.85}
#mxTheme:hover{opacity:1}
</style></head><body>
<button id="mxTheme" type="button" aria-label="밝은 화면과 어두운 화면 전환">
<span id="mxThemeIcon">◐</span><span id="mxThemeLabel">테마</span></button>
<div class="box">
<h1>열람코드를 입력하세요</h1>
<p>스튜디오엠엑스가 링크와 따로 전달한 코드입니다. 로그인은 필요 없습니다.</p>
<form id="f"><input id="c" type="password" placeholder="열람코드" autocomplete="off" autofocus>
<button type="submit" class="go">문서 열기</button><div class="err" id="e"></div></form>
</div>

paint();b.addEventListener("click",function(){var n=cur()==="dark"?"light":"dark";
